# --- CẤU HÌNH CŨ CỦA KHANG (GIỮ NGUYÊN) ---
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi

# --- CẤU HÌNH PHÍM TẮT MỚI ---
# Đổi phím prefix sang Ctrl+a cho thuận tay
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Chia màn hình nhanh (giữ nguyên đường dẫn hiện tại)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- GIAO DIỆN QUANT (MÀU CAM CHÁY #DC5F00) ---
# Hỗ trợ màu sắc chuẩn
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Màu thanh Status (Nền trong suốt hoặc mặc định, chữ màu cam)
set -g status-style bg=default,fg="#DC5F00"

# Bên trái: Hiện Session Name (ví dụ: Quant)
set -g status-left "#[fg=#ffffff,bg=#DC5F00,bold] 󰍹 #S #[default] "
set -g status-left-length 20

# Ở giữa: Danh sách các Window
set -g window-status-format "#[fg=#ffffff] #I:#W "
set -g window-status-current-format "#[fg=#ffffff,bg=#DC5F00,bold] #I:#W* "

# Bên phải: Thời gian cho dân Trading
set -g status-right "#[fg=#DC5F00]#[fg=#ffffff,bg=#DC5F00,bold] %H:%M 󰃭 %d/%m "

# Màu viền chia khung (Pane) - Để phân biệt ô đang active
set -g pane-border-style fg="#444444"
set -g pane-active-border-style fg="#DC5F00"

